 function switchTab(tab){const notes=tab==='rooms';details.classList.toggle('hidden',notes);document.getElementById('room-ideas').classList.toggle('hidden',!notes);document.getElementById('tab-furniture').classList.toggle('active',!notes);document.getElementById('tab-rooms').classList.toggle('active',notes);document.getElementById('tab-furniture').setAttribute('aria-selected',String(!notes));document.getElementById('tab-rooms').setAttribute('aria-selected',String(notes));}
 function showRoom(id){const room=roomData.find(r=>r.id===id);if(!room){roomContent.innerHTML='<p class="hint">此方案未记录房间想法。</p>';return;}activeRoom=id;paintRoomNavigation();activeReferences=(room.images||[]).filter(im=>typeof im.src==='string'&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(im.src));roomContent.innerHTML='<h2>'+escapeText(room.name)+'的想法</h2><h3>房间要求</h3>'+(room.text?.trim()?'<div class="room-text">'+escapeText(room.text)+'</div>':'<p class="hint">还没有记录文字想法。</p>')+'<h3>参考图片 <small>'+activeReferences.length+' 张</small></h3>'+(activeReferences.length?'<div class="reference-grid">'+activeReferences.map((im,i)=>'<figure><button class="reference-button" data-reference-index="'+i+'" aria-label="放大参考图片 '+(i+1)+'"><img src="'+im.src+'" alt="'+escapeText(im.caption||room.name+'参考图')+'"></button><figcaption>'+escapeText(im.caption||'未填写图片说明')+'</figcaption></figure>').join('')+'</div>':'<p class="hint">还没有添加参考图片。</p>');}
 roomSelect.innerHTML='<option value="">选择暂无记录的房间</option>'+emptyRooms.map(r=>'<option value="'+escapeText(r.id)+'">'+escapeText(r.name)+'</option>').join('');roomSelect.disabled=!emptyRooms.length;roomSelect.onchange=()=>{if(roomSelect.value)showRoom(roomSelect.value);};roomTags.addEventListener('click',e=>{const button=e.target.closest('[data-open-room]');if(button)showRoom(button.dataset.openRoom);});paintRoomNavigation();showRoom(activeRoom);
 document.getElementById('tab-furniture').onclick=()=>switchTab('furniture');document.getElementById('tab-rooms').onclick=()=>switchTab('rooms');
 roomContent.addEventListener('click',e=>{const button=e.target.closest('[data-reference-index]');if(!button)return;const im=activeReferences[Number(button.dataset.referenceIndex)];if(!im)return;document.getElementById('reference-image').src=im.src;document.getElementById('reference-caption').textContent=im.caption||'参考图片';document.getElementById('reference-preview').showModal();});
 document.getElementById('close-reference').onclick=()=>document.getElementById('reference-preview').close();

 apply();
})();</script></body></html>
